server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML: selalu revalidate ke origin supaya deploy/update langsung terlihat.
    # Cloudflare menghormati Cache-Control origin untuk HTML.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = / {
        add_header Cache-Control "no-cache";
    }

    # Data JSON (mis. data/leetcode.json yang diupdate cron):
    # revalidate tiap kali, browser tetap dapat data terbaru.
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
    }

    # Aset statis ber-query versioning (main.js?v=..., css): cache lama aman
    # karena URL berubah saat versi berubah.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
